# Cursor OpenAI Proxy — example configuration
# Copy to config.yaml and fill in your key (config.yaml is gitignored).
#
#   cp config.example.yaml config.yaml
#
# Key: https://cursor.com/dashboard/integrations

cursor_api_key: "cursor_REPLACE_ME"

# Server bind (use 0.0.0.0 in Docker/K8s; env HOST overrides)
host: "127.0.0.1"
port: 8765

# Cursor CLI binary name or absolute path
agent_bin: "agent"

# Default agent mode: ask | plan | agent
mode: "ask"

# Optional fixed workspace. Leave empty to use chat_only / cwd rules.
workspace: ""

# true = use a process-lifetime empty chat dir (no project file access)
chat_only: true

# Backend: sdk (Cursor Python SDK local, default) | cli (agent -p subprocess)
backend: "sdk"

# Keep Cursor worker-server processes between CLI requests (cli backend only).
reuse_workers: true
force_kill_workers: false

# Max concurrent agent runs
max_concurrent: 1

# Max seconds to wait for Cursor agent CLI per request (cli backend)
agent_timeout_seconds: 120
