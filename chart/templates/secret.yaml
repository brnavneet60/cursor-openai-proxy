{{- if and (not .Values.cursor.existingSecret) (not .Values.cursor.apiKey) }}
{{- fail "Set cursor.apiKey (e.g. --set-file cursor.apiKey=<(echo -n \"$CURSOR_API_KEY\")) or cursor.existingSecret" }}
{{- end }}
{{- if not .Values.cursor.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cursor-openai-bridge.fullname" . }}
  labels:
    {{- include "cursor-openai-bridge.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.cursor.existingSecretKey }}: {{ .Values.cursor.apiKey | quote }}
{{- end }}
